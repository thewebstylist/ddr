<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://trishsteele.com/{{canonical}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Trish Steele">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://trishsteele.com/{{canonical}}">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#FCF8F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170D14" media="(prefers-color-scheme: dark)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B1526'/%3E%3Ctext x='16' y='23' font-family='Didot,Georgia,serif' font-size='19' fill='%23E8A02C' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">

<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/bodoni-moda-normal-400_700-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/inter-normal-400_600-latin.woff2">
<link rel="stylesheet" href="assets/fonts/fonts.css">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script>
  /* Theme before first paint, so a dark viewer never sees a cream flash. */
  try {
    var t = localStorage.getItem('ts-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>
<div class="progress" data-progress aria-hidden="true"></div>

{{nav}}

<main id="main">
{{body}}
</main>

{{footer}}

<script src="assets/js/site.js" defer></script>
</body>
</html>
