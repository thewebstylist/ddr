<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://trishsteele.com/{{canonical}}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Trish Steele">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://trishsteele.com/{{canonical}}">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#EDE7DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100E0B" media="(prefers-color-scheme: dark)">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EDE7DC'/%3E%3Cpath d='M6 4h20M16 4v24' stroke='%236E1D24' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">

<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/bodoni-moda-normal-400_700-latin.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin
      href="assets/fonts/inter-normal-400_600-latin.woff2">
<link rel="stylesheet" href="assets/fonts/fonts.css">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script>
  /* Theme before first paint, so a dark viewer never sees a plaster flash. */
  try {
    var t = localStorage.getItem('ts-theme');
    if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>
<div class="progress" data-progress aria-hidden="true"></div>

<!-- THE THREAD. One path, drawn by scroll, running the whole height of the
     document. preserveAspectRatio="none" lets it stretch to any page length;
     non-scaling-stroke keeps the line the same weight regardless. -->
<div class="thread-layer" aria-hidden="true">
  <svg viewBox="0 0 100 1000" preserveAspectRatio="none" focusable="false">
    <path class="thread-ghost" d="{{threadpath}}"/>
    <path class="thread-path"  d="{{threadpath}}"/>
  </svg>
</div>

{{nav}}

<main id="main">
{{body}}
</main>

{{footer}}

<script src="assets/js/site.js" defer></script>
</body>
</html>
